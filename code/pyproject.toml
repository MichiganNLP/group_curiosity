[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "curioustogether-artifact"
version = "0.1.0"
description = "Anonymous artifact for curiosity-guided multi-agent language-model experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
models = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.34"]

[project.scripts]
curioustogether = "curioustogether.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
